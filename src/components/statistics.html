<section
    class="statistics-section"
    id="statistics"
    aria-labelledby="statistics-title">

    <div class="container">

        <div class="section-header">

            <span class="section-eyebrow">
                ParkSmart in numbers
            </span>

            <h2 id="statistics-title">
                Parking Made Simple
            </h2>

            <p>
                A smarter way to find, compare, and reserve parking
                spaces when you need them.
            </p>

        </div>

        <div class="stats-grid">

            <article class="stat-card">

                <div class="stat-icon" aria-hidden="true">
                    <i data-lucide="parking-square"></i>
                </div>

                <div class="stat-content">

                    <h3 class="stat-value">
                        1,250+
                    </h3>

                    <p class="stat-label">
                        Available Spaces
                    </p>

                </div>

            </article>


            <article class="stat-card">

                <div class="stat-icon" aria-hidden="true">
                    <i data-lucide="map"></i>
                </div>

                <div class="stat-content">

                    <h3 class="stat-value">
                        132+
                    </h3>

                    <p class="stat-label">
                        Parking Locations
                    </p>

                </div>

            </article>


            <article class="stat-card">

                <div class="stat-icon" aria-hidden="true">
                    <i data-lucide="calendar-check"></i>
                </div>

                <div class="stat-content">

                    <h3 class="stat-value">
                        8,200+
                    </h3>

                    <p class="stat-label">
                        Successful Bookings
                    </p>

                </div>

            </article>


            <article class="stat-card">

                <div class="stat-icon" aria-hidden="true">
                    <i data-lucide="star"></i>
                </div>

                <div class="stat-content">

                    <h3 class="stat-value">
                        4.9/5
                    </h3>

                    <p class="stat-label">
                        User Rating
                    </p>

                </div>

            </article>

        </div>

    </div>

</section>
