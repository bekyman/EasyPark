<section
    id="search"
    class="search-section">

    <div class="container">

        <div class="search-card">

            <div class="search-header">

                <span class="section-eyebrow">
                    Park smarter
                </span>

                <h2>
                    Find Your Perfect Parking Spot
                </h2>

                <p>
                    Search nearby parking spaces and reserve your spot
                    before you arrive.
                </p>

            </div>

            <form
                class="search-form"
                id="parking-search-form">

                <div class="search-grid">


                    <div class="input-card">

                        <i
                            data-lucide="map-pin"
                            aria-hidden="true">
                        </i>

                        <div class="input-content">

                            <label for="parking-location">
                                Location
                            </label>

                            <input
                                id="parking-location"
                                name="location"
                                type="text"
                                placeholder="Where are you going?"
                                autocomplete="street-address">

                        </div>

                    </div>


                    <div class="input-card">

                        <i
                            data-lucide="calendar-days"
                            aria-hidden="true">
                        </i>

                        <div class="input-content">

                            <label for="parking-date">
                                Date
                            </label>

                            <input
                                id="parking-date"
                                name="date"
                                type="date">

                        </div>

                    </div>


                    <div class="input-card">

                        <i
                            data-lucide="clock-3"
                            aria-hidden="true">
                        </i>

                        <div class="input-content">

                            <label for="parking-time">
                                Time
                            </label>

                            <input
                                id="parking-time"
                                name="time"
                                type="time">

                        </div>

                    </div>


                    <div class="input-card">

                        <i
                            data-lucide="car"
                            aria-hidden="true">
                        </i>

                        <div class="input-content">

                            <label for="vehicle-type">
                                Vehicle
                            </label>

                            <select
                                id="vehicle-type"
                                name="vehicle">

                                <option value="sedan">
                                    Sedan
                                </option>

                                <option value="suv">
                                    SUV
                                </option>

                                <option value="motorcycle">
                                    Motorcycle
                                </option>

                                <option value="van">
                                    Van
                                </option>

                            </select>

                        </div>

                    </div>

                </div>

                <button
                    type="submit"
                    class="btn btn-primary search-btn">

                    <i
                        data-lucide="search"
                        aria-hidden="true">
                    </i>

                    Search Parking

                </button>

            </form>

        </div>

    </div>

</section>
