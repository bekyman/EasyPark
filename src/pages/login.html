<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Login to your EasyPark account and manage your parking reservations.">

    <title>
        Login | EasyPark
    </title>


    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap"
        rel="stylesheet">


    <link
        rel="stylesheet"
        href="/src/styles/style.css">


    <link
        rel="stylesheet"
        href="/src/styles/pages/auth.css">


    <script
        src="https://unpkg.com/lucide@latest">
    </script>

</head>


<body>


    <main class="auth-page">

        <section class="auth-container">

            <div class="auth-brand">

                <a
                    href="/"
                    class="logo"
                    aria-label="EasyPark home">

                    EasyPark

                </a>

            </div>


            <div class="auth-card">

                <div class="auth-header">

                    <div class="auth-icon">
                        <i
                            data-lucide="log-in"
                            aria-hidden="true">
                        </i>
                    </div>

                    <h1>
                        Welcome Back
                    </h1>

                    <p>
                        Sign in to your EasyPark account
                        to manage your parking.
                    </p>

                </div>


                <form
                    class="auth-form"
                    id="login-form">

                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            class="form-control"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required>

                    </div>


                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <div class="password-field">

                            <input
                                type="password"
                                id="password"
                                name="password"
                                class="form-control"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required>

                            <button
                                type="button"
                                class="password-toggle"
                                aria-label="Show password">

                                <i
                                    data-lucide="eye"
                                    aria-hidden="true">
                                </i>

                            </button>

                        </div>

                    </div>


                    <div class="auth-options">

                        <label class="checkbox-group">

                            <input
                                type="checkbox"
                                id="remember"
                                name="remember">

                            <span>
                                Remember me
                            </span>

                        </label>


                        <a
                            href="/src/pages/reset.html"
                            class="auth-link">

                            Forgot password?

                        </a>

                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary auth-submit">

                        Login

                    </button>
                    

                </form>


                <div class="auth-footer">

                    <p>

                        Don't have an account?

                        <a
                            href="/src/pages/register.html"
                            class="auth-link">

                            Create an account

                        </a>

                    </p>

                </div>

            </div>

        </section>

    </main>


    <script>

        if (window.lucide) {
            window.lucide.createIcons();
        }

    </script>
    <script
        type="module"
        src="/src/scripts/auth.js">
    </script>
</body>

</html>
