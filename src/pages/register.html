<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Create your EasyPark account and start finding and reserving parking spaces.">

    <title>
        Register | EasyPark
    </title>


    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap"
        rel="stylesheet">


    <link
        rel="stylesheet"
        href="/src/styles/style.css">


    <link
        rel="stylesheet"
        href="/src/styles/pages/auth.css">


    <script
        src="https://unpkg.com/lucide@latest">
    </script>

</head>


<body>


    <main class="auth-page">

        <section class="auth-container">

            <div class="auth-brand">

                <a
                    href="/"
                    class="logo"
                    aria-label="EasyPark home">

                    EasyPark

                </a>

            </div>


            <div class="auth-card">

                <div class="auth-header">

                    <div class="auth-icon">

                        <i
                            data-lucide="user-plus"
                            aria-hidden="true">
                        </i>

                    </div>

                    <h1>
                        Create Your Account
                    </h1>

                    <p>
                        Join EasyPark and make parking
                        easier and more convenient.
                    </p>

                </div>


                <form
                    class="auth-form"
                    id="register-form">


                    <div class="form-group">

                        <label for="full-name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="full-name"
                            name="fullName"
                            class="form-control"
                            placeholder="Enter your full name"
                            autocomplete="name"
                            required>

                    </div>


                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            class="form-control"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required>

                    </div>


                    <div class="form-group">

                        <label for="phone">
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            class="form-control"
                            placeholder="Enter your phone number"
                            autocomplete="tel">

                    </div>


                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <div class="password-field">

                            <input
                                type="password"
                                id="password"
                                name="password"
                                class="form-control"
                                placeholder="Create a password"
                                autocomplete="new-password"
                                required>

                            <button
                                type="button"
                                class="password-toggle"
                                aria-label="Show password">

                                <i
                                    data-lucide="eye"
                                    aria-hidden="true">
                                </i>

                            </button>

                        </div>

                    </div>


                    <div class="form-group">

                        <label for="confirm-password">
                            Confirm Password
                        </label>

                        <div class="password-field">

                            <input
                                type="password"
                                id="confirm-password"
                                name="confirmPassword"
                                class="form-control"
                                placeholder="Confirm your password"
                                autocomplete="new-password"
                                required>

                            <button
                                type="button"
                                class="password-toggle"
                                aria-label="Show password">

                                <i
                                    data-lucide="eye"
                                    aria-hidden="true">
                                </i>

                            </button>

                        </div>

                    </div>


                    <label class="checkbox-group">

                        <input
                            type="checkbox"
                            id="terms"
                            name="terms"
                            required>

                        <span>
                            I agree to the
                            <a
                                href="#"
                                class="auth-link">
                                Terms of Service
                            </a>
                            and
                            <a
                                href="#"
                                class="auth-link">
                                Privacy Policy
                            </a>.
                        </span>

                    </label>


                    <button
                        type="submit"
                        class="btn btn-primary auth-submit">

                        Create Account

                    </button>

                </form>


                <div class="auth-footer">

                    <p>

                        Already have an account?

                        <a
                            href="/src/pages/login.html"
                            class="auth-link">

                            Login

                        </a>

                    </p>

                </div>

            </div>

        </section>

    </main>


    <script>

        if (window.lucide) {
            window.lucide.createIcons();
        }

    </script>

</body>

</html>
