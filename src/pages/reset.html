<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Reset your EasyPark account password securely.">

    <title>
        Reset Password | EasyPark
    </title>


    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap"
        rel="stylesheet">


    <link
        rel="stylesheet"
        href="/src/styles/style.css">


    <link
        rel="stylesheet"
        href="/src/styles/pages/auth.css">


    <script
        src="https://unpkg.com/lucide@latest">
    </script>

</head>


<body>


    <main class="auth-page">

        <section class="auth-container">

            <!-- Branding -->

            <div class="auth-brand">

                <a
                    href="/"
                    class="logo"
                    aria-label="EasyPark home">

                    EasyPark

                </a>

            </div>


            <div class="auth-card">

                <div class="auth-header">

                    <div class="auth-icon">

                        <i
                            data-lucide="key-round"
                            aria-hidden="true">
                        </i>

                    </div>

                    <h1>
                        Reset Your Password
                    </h1>

                    <p>
                        Enter the email address associated
                        with your EasyPark account and we'll
                        send you a password reset link.
                    </p>

                </div>


                <form
                    class="auth-form"
                    id="reset-form">


                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            class="form-control"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required>

                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary auth-submit">

                        Send Reset Link

                    </button>

                </form>


                <div class="auth-footer">

                    <p>

                        Remember your password?

                        <a
                            href="/src/pages/login.html"
                            class="auth-link">

                            Back to Login

                        </a>

                    </p>

                </div>

            </div>

        </section>

    </main>


    <script>

        if (window.lucide) {
            window.lucide.createIcons();
        }

    </script>

</body>

</html>
